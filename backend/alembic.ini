# Alembic configuration (task A4).
#
# Design ref: section 12 -- Alembic is the SINGLE SOURCE OF TRUTH for schema.
# There is no init.sql anymore; the old double-DDL drift is lesson C6.
#
# IMPORTANT: keep this file ASCII-only.
# Alembic reads it with configparser using encoding="locale". On a machine whose
# locale is not UTF-8 (e.g. cp950 on this dev box) any non-ASCII byte here makes
# every alembic command fail with UnicodeDecodeError before it even starts.
# The Chinese rationale therefore lives in alembic/env.py, which is Python source
# and always decoded as UTF-8.
#
# Why sqlalchemy.url is intentionally absent:
#   The connection string comes from toolhive.config (TOOLHIVE_DATABASE_URL),
#   resolved inside alembic/env.py. Keeping one source means migrations can never
#   run against a different database than the application connects to.

[alembic]
script_location = alembic

# Let env.py import the toolhive package from src/.
# Not strictly required once "pip install -e ." has been run, but harmless and it
# keeps migrations runnable from a fresh checkout.
prepend_sys_path = src

# Timestamped revision filenames: sorted by name == execution order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Path separator used by version_locations (must be "os" on Windows).
version_path_separator = os

# Server timezone is Asia/Beijing; keep migration timestamps aligned with it.
timezone = Asia/Beijing
