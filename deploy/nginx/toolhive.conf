# ToolHive 一期 Nginx 配置示例（H11）
#
# 前提：
# 1. ToolHive 应用只监听 127.0.0.1:8100，Nginx 与 ToolHive 部署在同一台主机；
# 2. 应用侧 network.trusted_proxies 必须包含 Nginx 来源（本机 127.0.0.1/32、::1/128）；
# 3. 生产必须通过 Nginx 转发，不允许客户端直连应用端口。
#
# Header 清洗原则：清除客户端提交的 Forwarded / X-Forwarded-For / X-Real-IP，
# 由 Nginx 按实际 TCP 连接写入 X-ToolHive-Ingress 与 X-ToolHive-Client-IP。

# ── 限流 zone（必须在 http 上下文内定义；本文件整体 include 进 http 块即可） ──
# 管理入口全局限流：10 r/s；登录/验证码等 auth 接口更严格：5 r/s；
# 运行入口基础限流（内网）：50 r/s。具体按调用系统的限流由应用层运行策略控制。
limit_req_zone $binary_remote_addr zone=th_admin_global:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=th_admin_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=th_runtime:10m rate=50r/s;

# ── 管理入口（公网 HTTPS） ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/ssl/admin.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 管理前端静态资源与页面路由
    location /admin/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        limit_req zone=th_admin_global burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-ToolHive-Ingress admin;
        proxy_set_header X-ToolHive-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    # 管理 API
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        limit_req zone=th_admin_global burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-ToolHive-Ingress admin;
        proxy_set_header X-ToolHive-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    # 登录、验证码、会话等 auth 接口使用更严格的限流（最长前缀优先于 /api/admin/）
    location /api/admin/auth/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        limit_req zone=th_admin_auth burst=8 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-ToolHive-Ingress admin;
        proxy_set_header X-ToolHive-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    # 健康检查（无需入口标识）
    location = /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }
}

# ── 运行入口（仅内网，一期不允许公网访问） ─────────────────────────
server {
    listen 8081;
    server_name _;

    # 仅转发运行 API；非 /api/runtime/v1/ 的请求一律拒绝（默认 404）
    location /api/runtime/v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        limit_req zone=th_runtime burst=100 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-ToolHive-Ingress runtime;
        proxy_set_header X-ToolHive-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    # 内网健康检查（可选）
    location = /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
