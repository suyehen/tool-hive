<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLight" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowDown" markerWidth="7" markerHeight="10" refX="3.5" refY="10" orient="auto">
      <polygon points="0 0, 7 0, 3.5 10" fill="#64748B"/>
    </marker>
    <marker id="arrowModule" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="1200" height="1050" fill="#F8FAFC"/>

  <!-- ===== Title ===== -->
  <rect x="0" y="0" width="1200" height="52" fill="url(#headerGrad)"/>
  <text x="600" y="33" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">ToolHive 系统架构图 — 一期上半部分（管理侧）</text>

  <!-- ===== SECTION: External Access Layer ===== -->
  <text x="40" y="82" fill="#475569" font-size="14" font-weight="700">外部访问层</text>

  <!-- Public zone background -->
  <rect x="40" y="95" width="540" height="80" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="58" y="115" fill="#DC2626" font-size="11" font-weight="600">🌐 公网区域</text>

  <!-- Admin browser -->
  <rect x="60" y="122" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="160" y="140" text-anchor="middle" fill="#1E293B" font-size="13" font-weight="600">🖥 管理员浏览器</text>
  <text x="160" y="155" text-anchor="middle" fill="#94A3B8" font-size="10">公网 HTTPS</text>

  <!-- Internal zone background -->
  <rect x="620" y="95" width="540" height="80" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="638" y="115" fill="#16A34A" font-size="11" font-weight="600">🔒 内网区域</text>

  <!-- Caller system -->
  <rect x="640" y="122" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="740" y="140" text-anchor="middle" fill="#1E293B" font-size="13" font-weight="600">🔧 调用系统</text>
  <text x="740" y="155" text-anchor="middle" fill="#94A3B8" font-size="10">内网 HTTPS</text>

  <!-- Down arrows from external layer -->
  <line x1="160" y1="175" x2="160" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="740" y1="175" x2="740" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== SECTION: Nginx Layer ===== -->
  <text x="40" y="232" fill="#475569" font-size="14" font-weight="700">Nginx 反向代理与安全网关</text>

  <rect x="40" y="245" width="1120" height="80" rx="8" fill="url(#nginxGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="275" text-anchor="middle" fill="#92400E" font-size="16" font-weight="700">Nginx — 反向代理 / TLS 终止 / 路由分发</text>

  <!-- Nginx capabilities -->
  <rect x="80" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="150" y="306" text-anchor="middle" fill="#78350F" font-size="11">🔐 TLS 1.2 / 1.3</text>

  <rect x="240" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="310" y="306" text-anchor="middle" fill="#78350F" font-size="11">🛡 HSTS / 安全Header</text>

  <rect x="400" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="470" y="306" text-anchor="middle" fill="#78350F" font-size="11">📋 路径路由分发</text>

  <rect x="560" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="630" y="306" text-anchor="middle" fill="#78350F" font-size="11">⏱ 请求限流</text>

  <rect x="720" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="790" y="306" text-anchor="middle" fill="#78350F" font-size="11">🌐 IP 白名单</text>

  <rect x="880" y="288" width="140" height="26" rx="4" fill="#FFFFFF" fill-opacity="0.7" stroke="#FCD34D" stroke-width="1"/>
  <text x="950" y="306" text-anchor="middle" fill="#78350F" font-size="11">🔄 来源IP解析</text>

  <!-- Route labels (between Nginx and next layer) -->
  <!-- Three down arrows from Nginx -->

  <!-- ===== SECTION: Route Paths ===== -->
  <text x="40" y="352" fill="#475569" font-size="14" font-weight="700">路由分发</text>

  <!-- Left path: /admin/** -->
  <line x1="256" y1="325" x2="256" y2="370" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="160" y="368" width="192" height="32" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="256" y="389" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="600">/admin/** → 管理前端</text>

  <!-- Center path: /api/admin/** -->
  <line x1="600" y1="325" x2="600" y2="370" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="504" y="368" width="192" height="32" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="600" y="389" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="600">/api/admin/** → 管理侧 API</text>

  <!-- Right path: /api/runtime/** -->
  <line x1="944" y1="325" x2="944" y2="370" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="848" y="368" width="192" height="32" rx="5" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="944" y="389" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">/api/runtime/** → 运行侧 API</text>

  <!-- Access policy labels -->
  <text x="256" y="414" text-anchor="middle" fill="#DC2626" font-size="10">公网可访问</text>
  <text x="600" y="414" text-anchor="middle" fill="#DC2626" font-size="10">公网可访问</text>
  <text x="944" y="414" text-anchor="middle" fill="#16A34A" font-size="10">仅内网可访问</text>

  <!-- Down arrows from routes to backend -->
  <line x1="256" y1="415" x2="256" y2="442" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="415" x2="600" y2="442" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="944" y1="415" x2="944" y2="442" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ===== SECTION: ToolHive Backend ===== -->
  <text x="40" y="470" fill="#475569" font-size="14" font-weight="700">ToolHive 后端</text>

  <!-- Backend container -->
  <rect x="40" y="480" width="1120" height="340" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"/>

  <!-- Backend label -->
  <text x="600" y="505" text-anchor="middle" fill="#1E40AF" font-size="15" font-weight="700">ToolHive 后端服务（单一项目，承载管理 + 运行双套 API）</text>

  <!-- Divider line -->
  <line x1="60" y1="515" x2="1140" y2="515" stroke="#BFDBFE" stroke-width="1"/>

  <!-- ===== MODULE 1: Admin Account Lifecycle ===== -->
  <rect x="60" y="530" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="530" width="240" height="30" rx="8" fill="#3B82F6"/>
  <rect x="60" y="552" width="240" height="8" fill="#3B82F6"/>
  <text x="180" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">模块一：管理账号生命周期</text>
  <text x="75" y="578" fill="#475569" font-size="11">• 首个超管初始化</text>
  <text x="75" y="594" fill="#475569" font-size="11">• 账号创建/禁用/锁定</text>
  <text x="75" y="610" fill="#475569" font-size="11">• 密码策略与强制修改</text>
  <text x="75" y="626" fill="#475569" font-size="11">• 超级管理员保护规则</text>
  <text x="60" y="648" text-anchor="middle" fill="#3B82F6" font-size="10" font-weight="600">来源：Q04</text>

  <!-- ===== MODULE 2: Auth & Session ===== -->
  <rect x="360" y="530" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="530" width="240" height="30" rx="8" fill="#8B5CF6"/>
  <rect x="360" y="552" width="240" height="8" fill="#8B5CF6"/>
  <text x="480" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">模块二：登录认证与会话安全</text>
  <text x="375" y="578" fill="#475569" font-size="11">• 本地登录 / SSO 预留</text>
  <text x="375" y="594" fill="#475569" font-size="11">• TOTP MFA 强制绑定</text>
  <text x="375" y="610" fill="#475569" font-size="11">• 共享会话 / 互斥登录</text>
  <text x="375" y="626" fill="#475569" font-size="11">• CSRF / 会话固定防御</text>
  <text x="360" y="648" text-anchor="middle" fill="#8B5CF6" font-size="10" font-weight="600">来源：Q05 + M02</text>

  <!-- ===== MODULE 3: Roles & Permissions ===== -->
  <rect x="660" y="530" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="530" width="240" height="30" rx="8" fill="#F59E0B"/>
  <rect x="660" y="552" width="240" height="8" fill="#F59E0B"/>
  <text x="780" y="550" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">模块三：后台角色与操作权限</text>
  <text x="675" y="578" fill="#475569" font-size="11">• 角色-操作项多对多模型</text>
  <text x="675" y="594" fill="#475569" font-size="11">• 管理操作项：对象:操作</text>
  <text x="675" y="610" fill="#475569" font-size="11">• 超级管理员内置角色</text>
  <text x="675" y="626" fill="#475569" font-size="11">• 管理与运行控制边界</text>
  <text x="660" y="648" text-anchor="middle" fill="#F59E0B" font-size="10" font-weight="600">来源：Q06 + Q07</text>

  <!-- Module arrows 1→2→3 -->
  <line x1="300" y1="582" x2="355" y2="582" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowModule)"/>
  <line x1="600" y1="582" x2="655" y2="582" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowModule)"/>

  <!-- ===== MODULE 4: Caller Systems ===== -->
  <rect x="660" y="660" width="240" height="105" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="660" width="240" height="30" rx="8" fill="#10B981"/>
  <rect x="660" y="682" width="240" height="8" fill="#10B981"/>
  <text x="780" y="680" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">模块四：调用系统管理</text>
  <text x="675" y="708" fill="#475569" font-size="11">• sys_ 前缀 UUID 标识</text>
  <text x="675" y="724" fill="#475569" font-size="11">• 草稿→启用→停用→注销</text>
  <text x="675" y="740" fill="#475569" font-size="11">• 环境隔离 / 负责人绑定</text>
  <text x="675" y="756" fill="#475569" font-size="11">• 启用前置条件校验</text>
  <text x="660" y="778" text-anchor="middle" fill="#10B981" font-size="10" font-weight="600">来源：Q08</text>

  <!-- Arrow M3 → M4 -->
  <line x1="780" y1="635" x2="780" y2="655" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowModule)"/>
  <text x="795" y="648" fill="#3B82F6" font-size="9" font-weight="600">配置管控</text>

  <!-- ===== MODULE 5: Network Security (foundation) ===== -->
  <rect x="60" y="660" width="540" height="105" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="660" width="540" height="30" rx="8" fill="#64748B"/>
  <rect x="60" y="682" width="540" height="8" fill="#64748B"/>
  <text x="330" y="680" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">模块五：网络安全与入口架构（基础层）</text>
  <text x="75" y="708" fill="#475569" font-size="11">• Nginx 统一路由：/admin/** · /api/admin/** · /api/runtime/**</text>
  <text x="75" y="724" fill="#475569" font-size="11">• 公网/内网访问策略隔离 · TLS 1.2/1.3 强制 · HSTS / 安全 Header</text>
  <text x="75" y="740" fill="#475569" font-size="11">• 管理入口限流 · CORS 同域策略 · 部署配置驱动地址</text>
  <text x="75" y="756" fill="#475569" font-size="11">• 管理侧来源限制与调用系统 IP 白名单相互独立</text>
  <text x="60" y="778" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">来源：M01</text>

  <!-- ===== SECTION: Data Layer ===== -->
  <text x="40" y="848" fill="#475569" font-size="14" font-weight="700">数据与基础设施层</text>

  <rect x="40" y="860" width="1120" height="70" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- Data boxes -->
  <rect x="70" y="875" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="170" y="893" text-anchor="middle" fill="#6D28D9" font-size="12" font-weight="600">🗄 PostgreSQL</text>
  <text x="170" y="907" text-anchor="middle" fill="#94A3B8" font-size="10">核心业务数据</text>

  <rect x="310" y="875" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="410" y="893" text-anchor="middle" fill="#6D28D9" font-size="12" font-weight="600">🔍 Chroma</text>
  <text x="410" y="907" text-anchor="middle" fill="#94A3B8" font-size="10">向量检索（工具发现）</text>

  <rect x="550" y="875" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="650" y="893" text-anchor="middle" fill="#6D28D9" font-size="12" font-weight="600">⚡ Redis / 缓存</text>
  <text x="650" y="907" text-anchor="middle" fill="#94A3B8" font-size="10">防重放 / 共享会话</text>

  <rect x="790" y="875" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="890" y="893" text-anchor="middle" fill="#6D28D9" font-size="12" font-weight="600">🔑 密钥管理</text>
  <text x="890" y="907" text-anchor="middle" fill="#94A3B8" font-size="10">公钥 / TOTP / 签名</text>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="950" width="1120" height="80" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

  <text x="70" y="975" fill="#1E293B" font-size="13" font-weight="700">图例</text>

  <!-- Network zone -->
  <rect x="70" y="988" width="16" height="16" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="92" y="1001" fill="#475569" font-size="11">公网区域</text>

  <rect x="170" y="988" width="16" height="16" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="192" y="1001" fill="#475569" font-size="11">内网区域</text>

  <!-- Module colors -->
  <rect x="290" y="988" width="16" height="16" rx="3" fill="#3B82F6"/>
  <text x="312" y="1001" fill="#475569" font-size="11">模块一</text>

  <rect x="390" y="988" width="16" height="16" rx="3" fill="#8B5CF6"/>
  <text x="412" y="1001" fill="#475569" font-size="11">模块二</text>

  <rect x="490" y="988" width="16" height="16" rx="3" fill="#F59E0B"/>
  <text x="512" y="1001" fill="#475569" font-size="11">模块三</text>

  <rect x="590" y="988" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="612" y="1001" fill="#475569" font-size="11">模块四</text>

  <rect x="690" y="988" width="16" height="16" rx="3" fill="#64748B"/>
  <text x="712" y="1001" fill="#475569" font-size="11">模块五</text>

  <!-- Arrow legend -->
  <line x1="820" y1="996" x2="860" y2="996" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowModule)"/>
  <text x="870" y="1001" fill="#475569" font-size="11">模块依赖</text>

  <!-- Control boundary legend -->
  <line x1="960" y1="996" x2="1000" y2="996" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="1010" y="1001" fill="#475569" font-size="11">请求流向</text>

  <!-- ===== Version ===== -->
  <text x="1160" y="1040" text-anchor="end" fill="#94A3B8" font-size="10">2026-08-10 · 基于需求确认记录</text>
</svg>
