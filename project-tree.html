<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolHive 项目目录树</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f7f8fa;
      color: #24292f;
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.tip { color: #57606a; font-size: 13px; margin: 0 0 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar input {
      flex: 1;
      min-width: 240px;
      padding: 7px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
    }
    .toolbar button {
      border: 1px solid #d0d7de;
      background: #ffffff;
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    .toolbar button:hover { background: #f3f4f6; }

    .tree ul {
      list-style: none;
      margin: 2px 0 4px 18px;
      padding-left: 14px;
      border-left: 1px dashed #d8dee4;
    }
    .tree > ul {
      margin-left: 0;
      padding-left: 0;
      border-left: none;
    }
    details { margin: 1px 0; }
    details > summary {
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
      user-select: none;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    details > summary:hover { background: #eef1f4; }
    details > summary::marker { content: "▸ "; color: #57606a; font-size: 13px; }
    details[open] > summary::marker { content: "▾ "; }
    li.file {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    li.file:hover { background: #eef1f4; }
    .icon { font-size: 13px; flex: none; }
    .name {
      font-family: Consolas, "Cascadia Code", Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      color: #0a66c2;
    }
    .desc {
      color: #57606a;
      font-size: 12px;
    }
    .no-result { color: #d1242f; padding: 12px; font-size: 14px; }

    /* ===== 增强样式（覆盖上方基础样式） ===== */
    body {
      padding: 34px 20px;
      background: radial-gradient(1100px 500px at 85% -10%, rgba(37, 99, 235, 0.16), transparent 60%),
                  radial-gradient(900px 420px at -8% 15%, rgba(139, 92, 246, 0.13), transparent 55%),
                  #edf2fa;
      color: #1f2937;
      font-size: 16px;
    }
    main { max-width: 1220px; }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #1e40af 0%, #4f46e5 55%, #7c3aed 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 26px 30px;
      margin-bottom: 20px;
      box-shadow: 0 12px 28px rgba(30, 64, 175, 0.22);
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    .hero .tip {
      margin: 10px 0 0;
      color: #dbeafe;
      font-size: 15px;
      line-height: 1.6;
    }
    .hero .tip code {
      background: rgba(255, 255, 255, 0.16);
      padding: 2px 7px;
      border-radius: 5px;
      color: #ffffff;
    }
    .hero-badge {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
      color: #f3f4ff;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px 20px 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }
    .toolbar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      align-items: center;
    }
    .toolbar input {
      padding: 10px 14px;
      font-size: 16px;
      border-color: #cbd5e1;
      border-radius: 9px;
      outline-color: #2563eb;
    }
    .toolbar button {
      padding: 9px 16px;
      font-size: 15px;
      border-radius: 9px;
      border-color: #cbd5e1;
      color: #334155;
    }
    .toolbar button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .toolbar button.primary:hover { background: #1d4ed8; }

    .tree {
      font-size: 15px;
      padding: 2px 4px 8px;
    }
    .tree details > summary {
      padding: 8px 10px;
      border-radius: 9px;
      line-height: 1.5;
    }
    .tree details > summary:hover { background: #eff6ff; }
    .tree li.file {
      padding: 6px 10px;
      border-radius: 9px;
      line-height: 1.5;
    }
    .tree li.file:hover { background: #f5f8ff; }
    .tree .name {
      font-size: 16px;
      color: #1d4ed8;
    }
    .tree li.file .name { color: #0f172a; }
    .tree .desc {
      font-size: 14px;
      color: #64748b;
    }
    .tree .icon { font-size: 15px; }

    function esc(value) {
      return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderItems(items) {
      const ul = document.createElement("ul");
      items.forEach((item) => {
        const li = document.createElement("li");
        const hasChildren = item.children && item.children.length > 0;

        if (hasChildren) {
          const details = document.createElement("details");
          details.open = true;
          const summary = document.createElement("summary");
          summary.innerHTML =
            '<span class="icon">📁</span>' +
            '<span class="name">' + esc(item.name) + "</span>" +
            (item.desc ? '<span class="desc">' + esc(item.desc) + "</span>" : "");
          details.appendChild(summary);
          details.appendChild(renderItems(item.children));
          li.appendChild(details);
        } else {
          li.className = "file";
          li.innerHTML =
            '<span class="icon">📄</span>' +
            '<span class="name">' + esc(item.name) + "</span>" +
            (item.desc ? '<span class="desc">' + esc(item.desc) + "</span>" : "");
        }
        ul.appendChild(li);
      });
      return ul;
    }

    function matches(node, query) {
      const text = ((node.name || "") + " " + (node.desc || "")).toLowerCase();
      return text.includes(query);
    }

    function filterNodes(nodes, query) {
      if (!query) return nodes;
      const out = [];
      nodes.forEach((node) => {
        const hit = matches(node, query);
        if (node.children && node.children.length) {
          const children = filterNodes(node.children, query);
          if (hit) {
            out.push(node);
          } else if (children.length) {
            out.push({ name: node.name, desc: node.desc, children });
          }
        } else if (hit) {
          out.push(node);
        }
      });
      return out;
    }

    const treeEl = document.getElementById("tree");
    const searchEl = document.getElementById("search");

    function refresh() {
      treeEl.innerHTML = "";
      const data = filterNodes(rootData, searchEl.value.trim().toLowerCase());
      if (!data.length) {
        const div = document.createElement("div");
        div.className = "no-result";
        div.textContent = "没有匹配的目录或文件";
        treeEl.appendChild(div);
        return;
      }
      treeEl.appendChild(renderItems(data));
    }

    searchEl.addEventListener("input", refresh);
    document.getElementById("expandAll").addEventListener("click", () => {
      treeEl.querySelectorAll("details").forEach((d) => { d.open = true; });
    });
    document.getElementById("collapseAll").addEventListener("click", () => {
      treeEl.querySelectorAll("details").forEach((d) => { d.open = false; });
    });

    refresh();
  </script>
